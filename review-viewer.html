.comment-item:hover { background: var(--hover); }

.comment-item p { display: -webkit-box; margin: 0; overflow: hidden; overflow-wrap: anywhere; color: var(--text); font-size: 12px; font-weight: 500; line-height: 18px; white-space: pre-wrap; -webkit-line-clamp: 3; -webkit-box-orient: vertical; }
.comment-item.is-text-expanded p { display: block; overflow: visible; -webkit-line-clamp: unset; }

.comment-number { flex: none; margin-inline-end: 2px; font-size: 11px; font-weight: 600; font-variant-numeric: tabular-nums; }
.comment-item.is-selected .comment-number { color: var(--accent); }
.comment-target { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.comment-state { flex: none; color: var(--muted); white-space: nowrap; }
.comment-item.is-done .comment-number { color: var(--faint); }
.comment-item.is-done p, .comment-item.is-done .comment-target, .comment-item.is-done .comment-state, .comment-item.is-done .comment-kind { color: var(--faint); text-decoration: line-through; }
.comment-item.is-done p code { background: transparent; }
.comment-controls { display: flex; flex: none; align-items: center; gap: 2px; margin: -3px 0 -3px auto; }
.comment-check { flex: none; display: grid; place-items: center; width: 24px; height: 24px; padding: 0; border: 0; border-radius: 4px; background: transparent; color: var(--muted); }

.comment-more-wrap { position: relative; display: flex; }

.comment-check, .comment-more { opacity: 0; transition: opacity 120ms ease, background 120ms ease; }
.comment-item:hover :is(.comment-check, .comment-more), .comment-item.is-selected :is(.comment-check, .comment-more), .comment-more[aria-expanded="true"], :is(.comment-check, .comment-more):focus-visible { opacity: 1; }
.comment-menu { position: absolute; z-index: 3; top: calc(100% + 6px); right: 0; display: grid; min-width: 110px; padding: 4px; border: 1px solid var(--line); border-radius: 6px; background: #fff; box-shadow: 0 8px 18px rgba(24, 24, 27, .14); cursor: default; }
.comment-menu.is-up { top: auto; bottom: calc(100% + 6px); }
.comment-menu button { display: flex; align-items: center; min-height: 28px; padding: 0 8px; border: 0; border-radius: 4px; background: transparent; color: #3f3f46; font: 650 11px/1 Inter, sans-serif; text-align: left; white-space: nowrap; }
.comment-menu button:hover, .comment-menu button:focus-visible { background: var(--hover); color: var(--ink); }
.comment-menu button.is-danger { color: var(--accent-ink); }
.comment-menu button.is-danger:hover, .comment-menu button.is-danger:focus-visible { background: #fee2e2; color: #991b1b; }
.comment-check:hover { background: rgba(24, 24, 27, .06); color: var(--ink); }
.comment-check i { display: grid; place-items: center; width: 16px; height: 16px; border: 1.5px solid #a1a1aa; border-radius: 4px; background: #fff; }
.comment-check svg { width: 12px; height: 12px; fill: none; stroke: #fff; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; opacity: 0; }

.comment-check[aria-checked="true"] svg { opacity: 1; }
.empty-note { margin: 4px 0 0; color: var(--muted); font-size: 11px; font-weight: 500; }
.footer-note { padding: 10px 12px; border-top: 1px solid var(--line); color: var(--faint); font-size: 10px; font-weight: 600; }

@media (max-width: 1100px) {
  .layout { grid-template-columns: 200px minmax(0, 1fr) 280px; }
  .progress-bar { display: none; }
}

  *, *::before, *::after { transition: none !important; }

<div class="app">

          <button type="button" id="shot-prev" aria-label="Previous screen" title="Previous screen ([)"><svg viewBox="0 0 16 16"><path d="M10 3.5L5.5 8l4.5 4.5"/></svg></button>
          <span id="shot-label"></span>
          <button type="button" id="shot-next" aria-label="Next screen" title="Next screen (])"><svg viewBox="0 0 16 16"><path d="M6 3.5L10.5 8 6 12.5"/></svg></button>

        <div class="zoom" role="group" aria-label="Zoom">

<script>
(() => {
  // Captured before rendering touches the DOM; saving writes this markup
  // back into the same file with the updated data.
  const PRISTINE_HTML = `<!doctype html>\n${document.documentElement.outerHTML}`;
  const data = JSON.parse(document.getElementById('pixelprism-review-data').textContent);
  const $ = (selector) => document.querySelector(selector);
  const ZOOM_STEPS = [0.25, 0.5, 0.75, 1, 1.25, 1.5, 2, 2.5, 3, 4];
  const STORAGE_KEY = `pixelprism-review:${data.id}`;
  const PINS_KEY = `pixelprism-review-pins:${data.id}`;
  const DELETED_KEY = `pixelprism-review-deleted:${data.id}`;
  const CHECK_ICON = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 8.5l3 3 6-7"/></svg>';
  const DOTS_ICON = '<svg viewBox="0 0 256 256" aria-hidden="true"><path d="M140,128a12,12,0,1,1-12-12A12,12,0,0,1,140,128Zm56-12a12,12,0,1,0,12,12A12,12,0,0,0,196,116ZM60,116a12,12,0,1,0,12,12A12,12,0,0,0,60,116Z"/></svg>';

  const state = { page: 0, viewport: 0, shot: 0, selected: null, expanded: null, menu: null, placing: null, zoom: 1, fit: true, done: new Set(), unsaved: false };
  // Checkmarks and points not yet written into the file live in
  // localStorage; once the file is saved, the file is the source of truth.
  const resolvedKey = (ids) => JSON.stringify([...ids].sort());
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    const stored = raw === null ? data.resolved : JSON.parse(raw);
    if (Array.isArray(stored)) stored.forEach((id) => state.done.add(id));
    if (raw !== null && resolvedKey(state.done) !== resolvedKey(data.resolved || [])) state.unsaved = true;
  } catch { /* Storage can be unavailable for file:// pages; checkmarks then last for the session. */ }

  const saveDone = () => {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify([...state.done])); } catch { /* See above. */ }
  };
  // Points placed by hand, by entry id: { shot, x, y } in screenshot pixels,
  // or null for a point that was removed. Kept until they are written into
  // the file, so closing the tab never loses work.
  let pinDraft = {};
  try {
    const stored = JSON.parse(localStorage.getItem(PINS_KEY) || '{}');
    if (stored && typeof stored === 'object' && !Array.isArray(stored)) pinDraft = stored;
  } catch { /* See above. */ }
  const savePinDraft = () => {
    try { localStorage.setItem(PINS_KEY, JSON.stringify(pinDraft)); } catch { /* See above. */ }
  };
  const el = (tag, className, text) => {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  };
  // Same breakpoints and glyphs PixelPrism's studio uses for its viewport icons.
  const DEVICE_ICONS = {
    phone: '<rect width="14" height="20" x="5" y="2" rx="2" ry="2"></rect><path d="M12 18h.01"></path>',
    'phone-wide': '<g transform="rotate(90 12 12)"><rect width="14" height="20" x="5" y="2" rx="2" ry="2"></rect><path d="M12 18h.01"></path></g>',
    tablet: '<rect width="16" height="20" x="4" y="2" rx="2" ry="2"></rect><path d="M12 18h.01"></path>',
    laptop: '<path d="M20 16V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v10"></path><path d="M2 16h20"></path><path d="M6 20h12"></path>',
    desktop: '<rect width="20" height="14" x="2" y="3" rx="2"></rect><path d="M8 21h8"></path><path d="M12 17v4"></path>'
  };
  function deviceGlyph(width) {
    if (width <= 450) return 'phone';
    if (width <= 620) return 'phone-wide';
    if (width <= 900) return 'tablet';
    if (width <= 1200) return 'laptop';
    return 'desktop';
  }
  function deviceIconSvg(width) {
    return `<svg viewBox="0 0 24 24" aria-hidden="true">${DEVICE_ICONS[deviceGlyph(width)]}</svg>`;
  }
  const pageEntries = (page) => page.viewports.flatMap((viewport) => viewport.entries);
  const currentPage = () => data.pages[state.page];
  const currentViewport = () => currentPage().viewports[state.viewport];
  const findEntry = (id) => {
    for (const [pageIndex, page] of data.pages.entries()) {
      for (const [viewportIndex, viewport] of page.viewports.entries()) {
        const entry = viewport.entries.find((candidate) => candidate.id === id);
        if (entry) return { entry, pageIndex, viewportIndex };
      }
    }
    return null;
  };
  // A page captured in one of its tabs is named after it: 1440 × 900 · Active.
  const viewportLabel = (viewport) => `${viewport.width} × ${viewport.height}${viewport.state ? ` · ${viewport.state}` : ''}`;
  const currentShot = () => currentViewport().shots[state.shot] || null;

  // Manual points. The automatic placement is kept in entry.auto so a point
  // can be undone; entry.pin is in page coordinates so the studio can put it
  // on a fresh screenshot after the review is imported back.
  const PLACEMENT_FIELDS = ['target', 'shot', 'rect', 'marker'];
  function applyPin(entry, viewport, shotIndex, x, y) {
    const shot = viewport.shots[shotIndex];
    if (!shot) return false;
    const px = Math.round(Math.min(Math.max(x, 0), shot.width));
    const py = Math.round(Math.min(Math.max(y, 0), shot.height));
    if (!entry.auto && !entry.pin) {
      entry.auto = {};
      PLACEMENT_FIELDS.forEach((field) => { if (entry[field] !== undefined) entry.auto[field] = entry[field]; });
    }
    entry.pin = { x: px, y: Math.round(py + (shot.scrollY || 0)) };
    entry.target = 'pin';
    entry.shot = shotIndex;
    entry.rect = { x: px, y: py, width: 0, height: 0 };
    entry.marker = { x: px, y: py, offset: 0 };
    return true;
  }
  function removePin(entry) {
    if (!entry.pin) return false;
    delete entry.pin;
    PLACEMENT_FIELDS.forEach((field) => { delete entry[field]; });
    if (entry.auto) {
      Object.assign(entry, entry.auto);
      delete entry.auto;
    } else {
      // The point came with the export; without it the comment is unplaced.
      entry.target = 'missing';
      entry.shot = 0;
    }
    return true;
  }
  const placementKey = (entry) => JSON.stringify([entry.target, entry.shot, entry.pin]);
  Object.entries(pinDraft).forEach(([id, pin]) => {
    const found = findEntry(id);
    if (!found) return;
    const before = placementKey(found.entry);
    if (pin) applyPin(found.entry, data.pages[found.pageIndex].viewports[found.viewportIndex], pin.shot, pin.x, pin.y);
    else removePin(found.entry);
    if (placementKey(found.entry) !== before) state.unsaved = true;
  });
  // Comments deleted here but not yet written into the file.
  let deletedDraft = [];
  try {
    const stored = JSON.parse(localStorage.getItem(DELETED_KEY) || '[]');
    if (Array.isArray(stored)) deletedDraft = stored;
  } catch { /* See above. */ }
  const saveDeletedDraft = () => {
    try { localStorage.setItem(DELETED_KEY, JSON.stringify(deletedDraft)); } catch { /* See above. */ }
  };
  function dropEntry(id) {
    const found = findEntry(id);
    if (!found) return false;
    const viewport = data.pages[found.pageIndex].viewports[found.viewportIndex];
    viewport.entries = viewport.entries.filter((entry) => entry.id !== id);
    return true;
  }
  deletedDraft.forEach((id) => {
    if (dropEntry(id)) state.unsaved = true;
    state.done.delete(id);
  });

  // Header
  const logo = $('#brand-logo');
  if (data.site.logo) {
    const image = el('img');
    image.src = data.site.logo;
    image.alt = '';
    logo.append(image);
  } else {
    logo.textContent = (data.site.name || 'W').trim().charAt(0).toUpperCase();
  }
  $('#brand-name').textContent = data.site.name || 'Design Review';
  const created = new Date(data.createdAt);
  $('#brand-meta').textContent = `Design Review · ${Number.isNaN(created.valueOf()) ? '' : new Intl.DateTimeFormat('en-US', { dateStyle: 'medium', timeStyle: 'short' }).format(created)}`;
  $('#pages-meta').textContent = `${data.pages.length} ${data.pages.length === 1 ? 'page' : 'pages'}`;

  function renderProgress() {
    const all = data.pages.flatMap(pageEntries);
    const done = all.filter((entry) => state.done.has(entry.id)).length;
    $('#progress-label').textContent = `${done} of ${all.length} resolved`;
    $('#progress-fill').style.width = all.length ? `${(done / all.length) * 100}%` : '0';
  }

  function renderPages() {
    $('#pages-list').replaceChildren(...data.pages.map((page, index) => {
      const entries = pageEntries(page);
      const done = entries.filter((entry) => state.done.has(entry.id)).length;
      const item = el('li');
      const button = el('button', 'page-item');
      button.type = 'button';
      button.dataset.page = String(index);
      button.setAttribute('aria-current', String(index === state.page));
      button.classList.toggle('is-complete', entries.length > 0 && done === entries.length);
      button.title = page.url;
      const icon = el('span', 'page-item-icon');
      icon.innerHTML = deviceIconSvg(page.viewports[0]?.width || 0);
      button.append(icon, el('span', 'page-item-name', page.label), el('span', 'page-item-count', `${done}/${entries.length}`));
      item.append(button);
      return item;
    }));
  }

  function entryText(entry, paragraph) {
    if (entry.kind !== 'change') {
      paragraph.textContent = entry.text;
      return;
    }
    const property = el('code', '', entry.property);
    const from = el('code', '', entry.from || 'none');
    const to = el('code', '', entry.to || 'removed');
    paragraph.append(property, ': ', from, ' → ', to);
  }

  function entryTarget(entry) {
    if (entry.target === 'page') return 'Whole page';
    if (entry.target === 'pin') return 'Point placed by hand';
    return entry.selector || 'Element';
  }

  function entryState(entry) {
    if (entry.target === 'missing') return 'Not found';
    if (entry.target === 'hidden') return 'Hidden';
    return '';
  }


  function renderSave() {
    const button = $('#save-file');
    const label = button.querySelector('span');
    const status = save.status;
    button.hidden = !state.unsaved && status !== 'saved';
    button.disabled = status === 'saving' || status === 'saved' || status === 'unsupported';
    if (status === 'saving') label.textContent = 'Saving...';
    else if (status === 'saved') label.textContent = 'Saved';
    else if (status === 'unsupported') label.textContent = 'Kept in this browser';
    else if (status === 'error') label.textContent = 'Save failed · Retry';
    else label.textContent = 'Save';
    button.title = ({
      unsupported: 'Saving into the file needs Chrome or Edge. Changes stay in this browser.',
      error: save.error || 'The file could not be written.',
      saved: 'Changes are saved into this file.'
    })[status] || `Pick this file (${reviewFileName()}) once. After that, changes are saved into it automatically.`;
  }

  function renderComments() {
    const page = currentPage();
    const entries = pageEntries(page);
    const done = entries.filter((entry) => state.done.has(entry.id)).length;
    const count = $('#comments-count');
    count.textContent = `${done}/${entries.length}`;
    count.classList.toggle('is-complete', entries.length > 0 && done === entries.length);
    $('#comments-groups').replaceChildren(...page.viewports.map((viewport, viewportIndex) => {
      const group = el('section', 'vp-group');
      group.classList.toggle('is-active', viewportIndex === state.viewport);
      const header = el('button', 'vp-header');
      header.type = 'button';
      header.dataset.viewport = String(viewportIndex);
      header.title = viewportLabel(viewport);
      header.append(
        el('span', '', `Screenshot ${viewportIndex + 1}`),
        el('span', 'vp-size', `${viewport.width} × ${viewport.height}`),
        el('span', 'vp-count', String(viewport.entries.length))
      );
      const list = el('ol', 'comments-list');
      viewport.entries.forEach((entry) => {
        const isDone = state.done.has(entry.id);
        const item = el('li', 'comment-item');
        item.dataset.entry = entry.id;
        item.classList.toggle('is-page', entry.target === 'page');
        item.classList.toggle('is-missing', entry.target === 'missing' || entry.target === 'hidden');
        item.classList.toggle('is-done', isDone);
        item.classList.toggle('is-selected', entry.id === state.selected);
        item.classList.toggle('is-text-expanded', entry.id === state.expanded);
        item.tabIndex = 0;
        if (entry.kind === 'change') item.append(el('span', 'comment-kind', 'CSS change'));
        const paragraph = el('p');
        entryText(entry, paragraph);
        item.append(paragraph);
        const meta = el('div', 'comment-meta');
        const number = el('span', 'comment-number', String(entry.number));
        const target = el('span', 'comment-target', entryTarget(entry));
        target.title = entryTarget(entry);
        const stateText = entryState(entry);
        const check = el('button', 'comment-check');
        check.type = 'button';
        check.dataset.check = entry.id;
        check.setAttribute('role', 'checkbox');
        check.setAttribute('aria-checked', String(isDone));
        check.setAttribute('aria-label', `Mark comment ${entry.number} as ${isDone ? 'not done' : 'done'}`);
        check.title = isDone ? 'Mark as not done' : 'Mark as done';
        const box = el('i');
        box.innerHTML = CHECK_ICON;
        check.append(box);
        meta.append(number, target);
        if (stateText) meta.append(el('span', 'comment-state', `· ${stateText}`));
        const controls = el('div', 'comment-controls');
        {
          const menuOpen = state.menu === entry.id;
          const more = el('button', 'comment-more');
          more.type = 'button';
          more.dataset.action = 'menu';
          more.dataset.entry = entry.id;
          more.title = 'Actions';
          more.setAttribute('aria-label', `Actions for comment ${entry.number}`);
          more.setAttribute('aria-haspopup', 'menu');
          more.setAttribute('aria-expanded', String(menuOpen));
          more.innerHTML = DOTS_ICON;
          const menu = el('div', 'comment-menu');
          menu.setAttribute('role', 'menu');
          menu.hidden = !menuOpen;
          const menuItem = (action, label, className) => {
            const button = el('button', className, label);
            button.type = 'button';
            button.setAttribute('role', 'menuitem');
            button.dataset.action = action;
            button.dataset.entry = entry.id;
            menu.append(button);
          };
          // Moving needs a screenshot to click on; deleting works everywhere.
          if (viewport.shots.length) {
            const placing = state.placing === entry.id;
            menuItem(placing ? 'cancel' : 'place', placing ? 'Cancel' : 'Move comment');
            if (entry.pin && entry.auto && !placing) menuItem('reset', 'Undo move');
          }
          menuItem('delete', 'Delete comment', 'is-danger');
          // The menu opens under its own button, left of the checkbox.
          const moreWrap = el('div', 'comment-more-wrap');
          moreWrap.append(more, menu);
          controls.append(moreWrap);
        }
        // The checkbox is the main action, so it stays at the far right.
        controls.append(check);
        meta.append(controls);
        item.append(meta);
        list.append(item);
      });
      group.append(header, list);
      return group;
    }));
    // Near the bottom of the panel the menu opens upwards to stay visible.
    const openMenu = document.querySelector('.comment-menu:not([hidden])');
    if (openMenu) {
      const panelBottom = $('#comments-groups').getBoundingClientRect().bottom;
      openMenu.classList.toggle('is-up', openMenu.getBoundingClientRect().bottom > panelBottom);
    }
  }

  // Stage
  const stage = $('#stage');
  const canvas = $('#canvas');
  const screenshot = $('#screenshot');
  const overlay = $('#overlay');
  const stageEmpty = $('#stage-empty');
  const STAGE_PADDING = 24;

  function fitZoom() {
    const shot = currentShot();
    if (!shot) return 1;
    const availableWidth = Math.max(80, stage.clientWidth - (STAGE_PADDING * 2));
    const availableHeight = Math.max(80, stage.clientHeight - (STAGE_PADDING * 2));
    return Math.min(1, availableWidth / shot.width, availableHeight / shot.height);
  }

  function applyZoom(zoom, anchor) {
    const shot = currentShot();
    if (!shot) return;
    const next = Math.min(4, Math.max(0.1, zoom));
    const previous = state.zoom;
    const rect = stage.getBoundingClientRect();
    const anchorX = anchor ? anchor.x - rect.left : stage.clientWidth / 2;
    const anchorY = anchor ? anchor.y - rect.top : stage.clientHeight / 2;
    const contentX = (stage.scrollLeft + anchorX - canvas.offsetLeft) / previous;
    const contentY = (stage.scrollTop + anchorY - canvas.offsetTop) / previous;
    state.zoom = next;
    canvas.style.width = `${Math.round(shot.width * next)}px`;
    canvas.style.height = `${Math.round(shot.height * next)}px`;
    stage.scrollLeft = (contentX * next) + canvas.offsetLeft - anchorX;
    stage.scrollTop = (contentY * next) + canvas.offsetTop - anchorY;
    $('#zoom-value').textContent = `${Math.round(next * 100)}%`;
    $('#zoom-fit').setAttribute('aria-pressed', String(state.fit));
    $('#zoom-actual').setAttribute('aria-pressed', String(!state.fit && Math.abs(next - 1) < 0.001));
  }

  function setFit() {
    state.fit = true;
    applyZoom(fitZoom());
  }

  function stepZoom(direction, anchor) {
    state.fit = false;
    const current = state.zoom;
    const next = direction > 0
      ? ZOOM_STEPS.find((step) => step > current + 0.001) ?? ZOOM_STEPS[ZOOM_STEPS.length - 1]
      : [...ZOOM_STEPS].reverse().find((step) => step < current - 0.001) ?? ZOOM_STEPS[0];
    applyZoom(next, anchor);
  }

  const percent = (value, total) => `${(value / total) * 100}%`;

  function renderOverlay() {
    const viewport = currentViewport();
    const shot = currentShot();
    overlay.replaceChildren();
    overlay.classList.toggle('has-selection', Boolean(state.selected));
    if (!shot) return;
    const onShot = viewport.entries.filter((entry) => entry.shot === state.shot);
    const selected = onShot.find((entry) => entry.id === state.selected);
    if (selected?.rect?.width && selected.rect.height) {
      const highlight = el('div', 'highlight');
      highlight.style.left = percent(selected.rect.x, shot.width);
      highlight.style.top = percent(selected.rect.y, shot.height);
      highlight.style.width = percent(selected.rect.width, shot.width);
      highlight.style.height = percent(selected.rect.height, shot.height);
      overlay.append(highlight);
    }
    onShot.forEach((entry) => {
      if (!entry.marker) return;
      const marker = el('button', 'marker', String(entry.number));
      marker.type = 'button';
      marker.dataset.entry = entry.id;
      marker.setAttribute('aria-label', `Comment ${entry.number}`);
      marker.classList.toggle('is-done', state.done.has(entry.id));
      marker.classList.toggle('is-selected', entry.id === state.selected);
      marker.style.left = percent(entry.marker.x, shot.width);
      marker.style.top = percent(entry.marker.y, shot.height);
      if (entry.marker.offset) marker.style.setProperty('--offset', `${entry.marker.offset * 24}px`);
      overlay.append(marker);
    });
  }

  function renderStage() {
    const page = currentPage();
    const viewport = currentViewport();
    const link = $('#stage-link');
    link.textContent = page.label;
    link.href = page.url;
    link.title = page.url;
    $('#stage-meta').textContent = viewportLabel(viewport);
    const shot = currentShot();
    const shotCount = viewport.shots.length;
    $('#shots-nav').hidden = shotCount < 2;
    $('#shot-label').textContent = `Screen ${state.shot + 1}/${shotCount}`;
    $('#shot-prev').disabled = state.shot <= 0;
    $('#shot-next').disabled = state.shot >= shotCount - 1;
    canvas.hidden = !shot;
    stageEmpty.hidden = Boolean(shot);
    document.querySelectorAll('.zoom button').forEach((button) => { button.disabled = !shot; });
    if (!shot) {
      const strong = el('strong', '', 'Screenshot unavailable');
      stageEmpty.replaceChildren(el('div'));
      stageEmpty.firstChild.append(strong, viewport.error || 'Chrome did not return an image for this viewport.');
      return;
    }
    if (screenshot.getAttribute('src') !== shot.src) screenshot.src = shot.src;
    state.fit = true;
    state.zoom = fitZoom();
    canvas.style.width = `${Math.round(shot.width * state.zoom)}px`;
    canvas.style.height = `${Math.round(shot.height * state.zoom)}px`;
    stage.scrollTo(0, 0);
    applyZoom(state.zoom);
    renderOverlay();
  }

  function render() {
    renderSave();
    renderProgress();
    renderPages();
    renderComments();
  }

  function scrollEntryIntoStage(entry) {
    const shot = currentShot();
    if (!shot || !entry.rect) return;
    const zoom = state.zoom;
    const centerX = canvas.offsetLeft + ((entry.rect.x + (entry.rect.width / 2)) * zoom);
    const top = canvas.offsetTop + (entry.rect.y * zoom);
    const height = entry.rect.height * zoom;
    const targetTop = height > stage.clientHeight - 80 ? top - 40 : top + (height / 2) - (stage.clientHeight / 2);
    stage.scrollTo({ left: centerX - (stage.clientWidth / 2), top: targetTop, behavior: 'smooth' });
  }

  function scrollEntryIntoPanel(id) {
    const item = document.querySelector(`.comment-item[data-entry="${CSS.escape(id)}"]`);
    item?.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }

  function stopPlacing() {
    if (!state.placing) return;
    state.placing = null;
    stage.classList.remove('is-placing');
    $('#place-hint').hidden = true;
  }

  function startPlacing(id) {
    const found = findEntry(id);
    if (!found) return;
    const viewport = data.pages[found.pageIndex].viewports[found.viewportIndex];
    if (!viewport.shots.length) return;
    if (state.selected !== id) selectEntry(id);
    state.placing = id;
    stage.classList.add('is-placing');
    const screens = viewport.shots.length > 1 ? ' Use [ and ] to switch screens.' : '';
    $('#place-hint-text').textContent = `Click where comment ${found.entry.number} belongs.${screens}`;
    $('#place-hint').hidden = false;
    renderComments();
    stage.focus({ preventScroll: true });
  }

  function cancelPlacing() {
    if (!state.placing) return;
    stopPlacing();
    renderComments();
  }

  function placeAt(event) {
    const found = findEntry(state.placing);
    const shot = currentShot();
    if (!found || !shot) return;
    const rect = canvas.getBoundingClientRect();
    const x = (event.clientX - rect.left) / state.zoom;
    const y = (event.clientY - rect.top) / state.zoom;
    const id = state.placing;
    stopPlacing();
    if (!applyPin(found.entry, currentViewport(), state.shot, x, y)) return;
    pinDraft[id] = { shot: state.shot, x: found.entry.marker.x, y: found.entry.marker.y };
    savePinDraft();
    markChanged();
    state.selected = id;
    render();
    renderOverlay();
  }

  function resetPlacement(id) {
    const found = findEntry(id);
    if (!found || !removePin(found.entry)) return;
    pinDraft[id] = null;
    savePinDraft();
    markChanged();
    stopPlacing();
    const shotCount = currentViewport().shots.length;
    state.shot = Math.min(found.entry.shot || 0, Math.max(0, shotCount - 1));
    render();
    renderStage();
  }

  function deleteEntry(id) {
    if (!dropEntry(id)) return;
    if (state.placing === id) stopPlacing();
    if (state.selected === id) state.selected = null;
    if (state.expanded === id) state.expanded = null;
    state.menu = null;
    state.done.delete(id);
    saveDone();
    delete pinDraft[id];
    savePinDraft();
    deletedDraft.push(id);
    saveDeletedDraft();
    markChanged();
    render();
    renderOverlay();
  }

  function reviewFileName() {
    try {
      return decodeURIComponent(location.pathname.split('/').pop() || '') || 'the review file';
    } catch {
      return 'the review file';
    }
  }

  function reviewHtml() {
    const snapshot = { ...data, resolved: [...state.done] };
    // Keep the embedded JSON from closing its <script> element early.
    const json = JSON.stringify(snapshot)
      .replace(/</g, '\\u003c')
      .replace(/\u2028/g, '\\u2028')
      .replace(/\u2029/g, '\\u2029');
    return PRISTINE_HTML.replace(
      /(<script type="application\/json" id="pixelprism-review-data">)[\s\S]*?(<\/script>)/,
      (match, open, close) => open + json + close
    );
  }

  // A page cannot write to its own file on its own: the viewer asks for this
  // file once through the file picker, then keeps the handle (IndexedDB) and
  // writes every change into it.
  const save = { status: 'idle', error: '', version: 0, handle: null, running: false, again: false, timer: null, hideTimer: null };
  const canSaveToFile = typeof window.showOpenFilePicker === 'function';

  function handleStore(mode, action) {
    return new Promise((resolve, reject) => {
      const request = indexedDB.open('pixelprism-review-files', 1);
      request.onupgradeneeded = () => request.result.createObjectStore('handles');
      request.onerror = () => reject(request.error);
      request.onsuccess = () => {
        const db = request.result;
        const transaction = db.transaction('handles', mode);
        const operation = action(transaction.objectStore('handles'));
        transaction.oncomplete = () => { db.close(); resolve(operation.result); };
        transaction.onerror = () => { db.close(); reject(transaction.error); };
      };
    });
  }

  function reviewIdOf(html) {
    const parsed = new DOMParser().parseFromString(html, 'text/html');
    try {
      return JSON.parse(parsed.getElementById('pixelprism-review-data')?.textContent || '{}').id;
    } catch {
      return undefined;
    }
  }

  async function writableHandle(interactive) {
    if (!save.handle) save.handle = await handleStore('readonly', (store) => store.get(data.id)).catch(() => null);
    if (save.handle) {
      if (await save.handle.queryPermission({ mode: 'readwrite' }) === 'granted') return save.handle;
      if (!interactive) return null;
      return await save.handle.requestPermission({ mode: 'readwrite' }) === 'granted' ? save.handle : null;
    }
    if (!interactive) return null;
    const [picked] = await window.showOpenFilePicker({
      id: 'pixelprism-review',
      startIn: 'downloads',
      types: [{ description: 'Design review', accept: { 'text/html': ['.html', '.htm'] } }]
    });
    if (reviewIdOf(await (await picked.getFile()).text()) !== data.id) {
      throw new Error(`That is a different review. Pick ${reviewFileName()}, the file open in this tab.`);
    }
    save.handle = picked;
    handleStore('readwrite', (store) => store.put(picked, data.id)).catch(() => {});
    // The picker may use up the click; the next click then asks for access.
    const permission = await picked.requestPermission({ mode: 'readwrite' }).catch(() => 'prompt');
    return permission === 'granted' ? picked : null;
  }

  async function saveToFile(interactive) {
    if (!state.unsaved) return;
    if (!canSaveToFile) {
      save.status = 'unsupported';
      renderSave();
      return;
    }
    if (save.running) {
      save.again = true;
      return;
    }
    save.running = true;
    const version = save.version;
    clearTimeout(save.hideTimer);
    save.status = 'saving';
    renderSave();
    try {
      const handle = await writableHandle(interactive);
      if (!handle) {
        save.status = 'idle';
        return;
      }
      const writable = await handle.createWritable();
      await writable.write(reviewHtml());
      await writable.close();
      if (version === save.version) {
        state.unsaved = false;
        pinDraft = {};
        deletedDraft = [];
        try {
          localStorage.removeItem(PINS_KEY);
          localStorage.removeItem(DELETED_KEY);
          localStorage.removeItem(STORAGE_KEY);
        } catch { /* Nothing to clean up. */ }
      }
      save.status = 'saved';
      save.hideTimer = setTimeout(() => {
        if (save.status === 'saved') save.status = 'idle';
        renderSave();
      }, 1800);
    } catch (error) {
      save.status = error?.name === 'AbortError' ? 'idle' : 'error';
      save.error = error?.message || '';
    } finally {
      save.running = false;
      renderSave();
      if (save.again || (state.unsaved && save.status === 'saved')) {
        save.again = false;
        saveToFile(false);
      }
    }
  }

  function markChanged() {
    state.unsaved = true;
    save.version += 1;
    if (save.status === 'saved') save.status = 'idle';
    renderSave();
    clearTimeout(save.timer);
    save.timer = setTimeout(() => saveToFile(false), 400);
  }

  function selectPage(index) {
    if (index === state.page) return;
    stopPlacing();
    state.page = index;
    state.viewport = 0;
    state.shot = 0;
    state.selected = null;
    state.expanded = null;
    state.menu = null;
    render();
    renderStage();
    $('#comments-groups').scrollTop = 0;
  }

  function selectViewport(index) {
    if (index === state.viewport) return;
    stopPlacing();
    state.viewport = index;
    state.shot = 0;
    state.selected = null;
    state.expanded = null;
    state.menu = null;
    renderComments();
    renderStage();
  }

  function selectEntry(id, { fromMarker = false } = {}) {
    const found = findEntry(id);
    if (!found) return;
    if (state.placing && state.placing !== id) stopPlacing();
    const pageChanged = found.pageIndex !== state.page;
    const viewportChanged = pageChanged || found.viewportIndex !== state.viewport || found.entry.shot !== state.shot;
    state.page = found.pageIndex;
    state.viewport = found.viewportIndex;
    state.shot = found.entry.shot || 0;
    state.selected = state.selected === id && fromMarker ? null : id;
    if (pageChanged) renderPages();
    renderComments();
    if (viewportChanged) renderStage();
    else renderOverlay();
    if (!state.selected) return;
    scrollEntryIntoPanel(id);
    if (!fromMarker) scrollEntryIntoStage(found.entry);
  }

  // Clicking a card selects it and expands its text past the three-line
  // clamp; opening one collapses whichever other one was open.
  function toggleEntryExpanded(id) {
    state.expanded = state.expanded === id ? null : id;
    selectEntry(id);
  }

  function selectShot(index) {
    const count = currentViewport().shots.length;
    if (index < 0 || index >= count || index === state.shot) return;
    state.shot = index;
    const selected = currentViewport().entries.find((entry) => entry.id === state.selected);
    // While placing, the comment stays selected on every screen.
    if (selected && selected.shot !== index && !state.placing) state.selected = null;
    renderComments();
    renderStage();
  }

  function clearSelection() {
    if (!state.selected) return;
    stopPlacing();
    state.selected = null;
    renderComments();
    renderOverlay();
  }

  function toggleDone(id) {
    if (state.done.has(id)) state.done.delete(id);
    else state.done.add(id);
    saveDone();
    markChanged();
    render();
    renderOverlay();
  }

  function moveSelection(direction) {
    const entries = pageEntries(currentPage());
    if (!entries.length) return;
    const index = entries.findIndex((entry) => entry.id === state.selected);
    const next = index < 0 ? (direction > 0 ? 0 : entries.length - 1) : Math.min(entries.length - 1, Math.max(0, index + direction));
    selectEntry(entries[next].id);
  }

  // Events
  $('#pages-list').addEventListener('click', (event) => {
    const button = event.target.closest('[data-page]');
    if (button) selectPage(Number(button.dataset.page));
  });

  function closeMenu() {
    if (!state.menu) return;
    state.menu = null;
    renderComments();
  }
  // A click outside the comments list (stage, pages) closes an open menu.
  document.addEventListener('click', (event) => {
    // The path is taken before the list re-renders, so a click that just
    // opened the menu is still recognised as inside the list.
    if (state.menu && !event.composedPath().includes($('#comments-groups'))) closeMenu();
  });

  $('#comments-groups').addEventListener('click', (event) => {
    const action = event.target.closest('[data-action]');
    if (action) {
      const { entry } = action.dataset;
      if (action.dataset.action === 'menu') {
        state.menu = state.menu === entry ? null : entry;
        renderComments();
        return;
      }
      state.menu = null;
      if (action.dataset.action === 'place') startPlacing(entry);
      else if (action.dataset.action === 'cancel') cancelPlacing();
      else if (action.dataset.action === 'reset') resetPlacement(entry);
      else if (action.dataset.action === 'delete') deleteEntry(entry);
      renderComments();
      return;
    }
    // Any other click inside the list closes an open menu first.
    if (state.menu) {
      state.menu = null;
      renderComments();
      return;
    }
    const check = event.target.closest('[data-check]');
    if (check) {
      toggleDone(check.dataset.check);
      return;
    }
    const header = event.target.closest('[data-viewport]');
    if (header) {
      selectViewport(Number(header.dataset.viewport));
      return;
    }
    const item = event.target.closest('.comment-item');
    if (item) toggleEntryExpanded(item.dataset.entry);
  });

  $('#comments-groups').addEventListener('keydown', (event) => {
    const item = event.target.closest('.comment-item');
    if (!item || event.target !== item) return;
    if (event.key === 'Enter') { event.preventDefault(); toggleEntryExpanded(item.dataset.entry); }
    if (event.key === ' ') { event.preventDefault(); toggleDone(item.dataset.entry); }
  });

  overlay.addEventListener('click', (event) => {
    // While placing, a click on a marker is a click on the screenshot.
    if (state.placing) return;
    const marker = event.target.closest('.marker');
    if (marker) {
      event.stopPropagation();
      selectEntry(marker.dataset.entry, { fromMarker: true });
    }
  });

  let drag = null;
  let dragMoved = false;
  stage.addEventListener('pointerdown', (event) => {
    if (event.button !== 0 || (event.target.closest('.marker') && !state.placing)) return;
    drag = { x: event.clientX, y: event.clientY, left: stage.scrollLeft, top: stage.scrollTop };
    dragMoved = false;
  });
  window.addEventListener('pointermove', (event) => {
    if (!drag) return;
    const dx = event.clientX - drag.x;
    const dy = event.clientY - drag.y;
    if (!dragMoved && Math.hypot(dx, dy) < 4) return;
    dragMoved = true;
    stage.classList.add('is-dragging');
    stage.scrollLeft = drag.left - dx;
    stage.scrollTop = drag.top - dy;
  });
  window.addEventListener('pointerup', () => {
    drag = null;
    stage.classList.remove('is-dragging');
  });
  stage.addEventListener('click', (event) => {
    if (dragMoved) return;
    if (state.placing) {
      if (event.target.closest('#canvas')) placeAt(event);
      return;
    }
    if (event.target.closest('.marker')) return;
    clearSelection();
  });

  stage.addEventListener('wheel', (event) => {
    if (!event.ctrlKey && !event.metaKey) return;
    event.preventDefault();
    state.fit = false;
    const factor = Math.exp(-event.deltaY * (event.deltaMode === 1 ? 0.05 : 0.0025));
    applyZoom(Math.min(4, Math.max(0.25, state.zoom * factor)), { x: event.clientX, y: event.clientY });
  }, { passive: false });

  $('#place-cancel').addEventListener('click', cancelPlacing);
  $('#save-file').addEventListener('click', () => saveToFile(true));
  $('#shot-prev').addEventListener('click', () => selectShot(state.shot - 1));
  $('#shot-next').addEventListener('click', () => selectShot(state.shot + 1));
  $('#zoom-in').addEventListener('click', () => stepZoom(1));
  $('#zoom-out').addEventListener('click', () => stepZoom(-1));
  $('#zoom-fit').addEventListener('click', setFit);
  const actualSize = () => { state.fit = false; applyZoom(1); };
  $('#zoom-actual').addEventListener('click', actualSize);
  $('#zoom-value').addEventListener('click', actualSize);

  document.addEventListener('keydown', (event) => {
    if (event.target.closest('input, textarea, [contenteditable="true"]')) return;
    const modifier = event.ctrlKey || event.metaKey;
    if (event.key === '+' || event.key === '=') { event.preventDefault(); stepZoom(1); }
    else if (event.key === '-' || event.key === '_') { event.preventDefault(); stepZoom(-1); }
    else if (event.key === '0' && !event.altKey) { event.preventDefault(); setFit(); }
    else if (event.key === '1' && !modifier) actualSize();
    else if (event.key === 'Escape') { if (state.menu) closeMenu(); else if (state.placing) cancelPlacing(); else clearSelection(); }
    else if (event.key === '[') selectShot(state.shot - 1);
    else if (event.key === ']') selectShot(state.shot + 1);
    else if (!modifier && (event.key === 'ArrowDown' || event.key === 'j')) { event.preventDefault(); moveSelection(1); }
    else if (!modifier && (event.key === 'ArrowUp' || event.key === 'k')) { event.preventDefault(); moveSelection(-1); }
  });

  new ResizeObserver(() => { if (state.fit) applyZoom(fitZoom()); }).observe(stage);

  render();
  renderStage();
  // Work left from an earlier visit goes into the file as soon as access allows.
  if (state.unsaved) saveToFile(false);
})();
</script>
</body>
</html>
